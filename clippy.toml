# Clippy thresholds for this crate.
# Allow/deny for specific lints lives in Cargo.toml `[lints.clippy]` (authoritative).
# CI enforces: cargo clippy --all-targets -- -D warnings
# See AGENTS.md "Lint / diff hygiene".

cognitive-complexity-threshold = 30
too-many-arguments-threshold = 8
too-many-lines-threshold = 150
